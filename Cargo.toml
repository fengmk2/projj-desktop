[package]
name = "projj"
version = "1.0.0"
edition = "2024"
description = "Manage git repositories with directory conventions"
license = "MIT"
repository = "https://github.com/fengmk2/projj-desktop"
homepage = "https://github.com/fengmk2/projj-desktop"
readme = "README.md"
keywords = ["git", "repository", "cli", "project", "management"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "projj-desktop-backend"
path = "src/desktop/main.rs"

[dependencies]
libc = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = "0.11"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
toml = "0.8"
walkdir = "2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rexpect = "0.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
