name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-features
      - run: npm test
      - run: cargo build --release --bins --locked
  macos-app:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run package
      - run: codesign --verify --deep --strict dist/Projj.app
      - run: ditto -c -k --keepParent dist/Projj.app dist/Projj-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Projj-macOS
          path: dist/Projj-macOS.zip

  homebrew:
    name: Homebrew (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_ASK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install from this repository
        run: |
          brew tap fengmk2/projj-desktop "$GITHUB_WORKSPACE"
          brew install --cask fengmk2/projj-desktop/projj-desktop
          test "$(git -C "$(brew --repository fengmk2/projj-desktop)" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify the cask and installation
        run: |
          brew style --cask fengmk2/projj-desktop/projj-desktop
          brew audit --cask fengmk2/projj-desktop/projj-desktop
          test -d /Applications/Projj.app
          codesign --verify --deep --strict /Applications/Projj.app
          "$(brew --prefix)/bin/projj" --version
      - name: Uninstall
        run: brew uninstall --cask fengmk2/projj-desktop/projj-desktop
